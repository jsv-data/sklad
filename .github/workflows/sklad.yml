name: Sklad
on:
  schedule:
    - cron: "20 * * * *"   # kazdou hodinu ve 20 minut
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sklad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python prevod.py
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
      - run: |
          git config user.name "sklad-bot"
          git config user.email "sklad-bot@users.noreply.github.com"
          git add sklad.csv
          git commit -m "Sklad $(date -u +%F)" || echo "beze zmen"
          git push
