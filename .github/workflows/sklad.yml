name: Sklad
on:
  schedule:
    - cron: "20 * * * *"   # kazdou hodinu ve 20 minut
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sklad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stazeni zdroje
        run: |
          curl -sS -L --retry 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36" -o feed.csv -w "HTTP %{http_code}, %{size_download} B\n" "$FEED_URL"
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
      - run: python prevod.py
        env:
          FEED_URL: ${{ secrets.FEED_URL }}
          FEED_FILE: feed.csv
      - run: |
          git config user.name "sklad-bot"
          git config user.email "sklad-bot@users.noreply.github.com"
          git add sklad.csv
          git commit -m "Sklad $(date -u +%F)" || echo "beze zmen"
          git push
